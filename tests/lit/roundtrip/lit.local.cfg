# Needs ptxas and cuobjdump: unsupported without them, unless
# PTXROOF_REQUIRE_CUDA is set.
import os
import shutil
import sys

sys.path.insert(0, config.test_source_root)
from ptxas_roundtrip import RoundTrip

tests = os.path.dirname(config.test_source_root)
fixtures, allowlist = os.path.join(tests, "fixtures"), os.path.join(tests, "roundtrip-allowlist.txt")
config.test_format = RoundTrip(config.ptxroof, fixtures, allowlist)
missing = [t for t in ("ptxas", "cuobjdump") if not shutil.which(t)]
if missing and os.environ.get("PTXROOF_REQUIRE_CUDA"):
    lit_config.fatal(f"PTXROOF_REQUIRE_CUDA is set, but PATH lacks {', '.join(missing)}")
config.unsupported = bool(missing)
