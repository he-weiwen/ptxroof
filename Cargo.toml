[package]
name = "ptxroof"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Static roofline analysis for PTX kernels"
license = "MIT"
publish = false

# One package, two targets: the library (src/lib.rs) is the product, the
# binary (src/main.rs) is a thin CLI shell over it. Dependencies join the
# manifest at the PR that first uses them, never earlier, so the
# Cargo.lock diff of each PR attributes every new dependency to the code
# that needed it.

[dependencies]
anyhow = "1"          # binary-only error rendering
clap = { version = "4", features = ["derive"] }
cpp_demangle = "0.4"  # kernel names; fallible -> plain names pass through
serde = { version = "1", features = ["derive"] }  # the result tree derives Serialize
serde_json = "1"      # --json IS that derivation
thiserror = "2"       # library error types

[dev-dependencies]
insta = "1"           # integration-test snapshots (PTX dumps, loop trees)
